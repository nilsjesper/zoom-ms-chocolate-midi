# Footswitch layout for make_fcp.py. group = 1-8, switch = "A"-"D".
# Unlisted switches keep CubeSuite's default (PC 0, which loads patch 1), so give every switch
# you'll press an action.
#
# Actions and their keys:
#   cc_toggle      cc, label, channel (both optional)  alternates CC 127/0; first press after import sends 127
#   effect_toggle  effect                    effect on/off (1-6 on MIDISTOMP, 1-3 on stock); first press turns it off
#   program        patch, revert (optional)  jump to patch 1-50 as shown on the pedal; revert defaults to true
#   revert_edits   (no keys)                 discard unsaved edits, stay on the current patch
#   patch_step     step                      MIDISTOMP v1.1+: 1 = next patch (CC 81), -1 = previous (CC 80)
#
# Any entry can also have firmware = "midistomp" or "stock": it is skipped when make_fcp.py
# builds for the other firmware (--firmware).

[[switch]]
group = 1
switch = "A"
action = "cc_toggle"      # alternates 127/0; first press after import sends 127
cc = 74
label = "tuner on/off"    # optional

[[switch]]
group = 1
switch = "B"
action = "effect_toggle"
effect = 3

[[switch]]
group = 1
switch = "C"
action = "effect_toggle"
effect = 2

[[switch]]
group = 1
switch = "D"
action = "effect_toggle"
effect = 1

[[switch]]
group = 2
switch = "A"
action = "program"        # there is no tap-tempo MIDI message, so a patch jump
patch = 1
firmware = "midistomp"

[[switch]]
group = 2
switch = "B"
action = "effect_toggle"
effect = 6
firmware = "midistomp"

[[switch]]
group = 2
switch = "C"
action = "effect_toggle"
effect = 5
firmware = "midistomp"

[[switch]]
group = 2
switch = "D"
action = "effect_toggle"
effect = 4
firmware = "midistomp"

# Jump to patch 12 as shown on the pedal. Editor-off is sent first so unsaved edits
# are discarded instead of being saved into the patch being left.
# [[switch]]
# group = 3
# switch = "A"
# action = "program"
# patch = 12

# Plain Program Change to patch 13; pending edits get saved into the old patch.
# [[switch]]
# group = 3
# switch = "B"
# action = "program"
# patch = 13
# revert = false

# Discard unsaved edits, stay on the current patch.
# [[switch]]
# group = 3
# switch = "C"
# action = "revert_edits"

# Previous / next patch (MIDISTOMP v1.1+).
# [[switch]]
# group = 3
# switch = "D"
# action = "patch_step"
# step = 1

# Other gear on the same USB host port: send it CCs on a channel the pedal ignores
# (set the pedal's MIDI CHANNEL to something else).
# [[switch]]
# group = 4
# switch = "A"
# action = "cc_toggle"
# cc = 20
# channel = 1
